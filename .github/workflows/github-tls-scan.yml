
name: GitHub endpoints TLS scan

# Example workflow: lists the TLS configuration of the GitHub endpoints
# published by https://api.github.com/meta and reports which of them already
# offer a post-quantum (hybrid ML-KEM) key exchange.
on:
  workflow_dispatch:
    inputs:
      meta_url:
        description: Meta endpoint to read the endpoint list from (defaults to this instance's own API)
        required: false
        default: ""
      max_hosts:
        description: Maximum number of endpoints to scan (0 = all)
        required: false
        default: "0"
  # "init" run: also scan whenever the scanner itself changes.
  push:
    paths:
      - .github/workflows/github-tls-scan.yml
      - scripts/scan-github-tls.ps1

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Alpine 3.22 ships OpenSSL 3.5, which supports the hybrid ML-KEM groups
    # (X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024).
    container:
      image: alpine:3.22
    env:
      PWSH_VERSION: 7.4.20
    steps:
      - name: Install dependencies
        run: apk add --no-cache curl git openssl ca-certificates less ncurses-terminfo-base krb5-libs libgcc libintl libssl3 libstdc++ tzdata userspace-rcu zlib icu-libs

      - name: Install PowerShell
        run: |
          curl -L "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-musl-x64.tar.gz" -o /tmp/powershell.tar.gz
          mkdir -p /opt/microsoft/powershell/7
          tar zxf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/7
          chmod +x /opt/microsoft/powershell/7/pwsh
          ln -s /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan GitHub endpoints
        shell: pwsh
        env:
          META_URL: ${{ inputs.meta_url || format('{0}/meta', github.api_url) }}
          MAX_HOSTS: ${{ inputs.max_hosts || '0' }}
          OUTPUT_DIR: tls-report
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/scan-github-tls.ps1

      - name: Publish report to the job summary
        run: cat tls-report/github-tls-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: github-tls-report
          path: tls-report/
